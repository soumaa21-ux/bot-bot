# Spécifications par symbole.
# ATTENTION : valeurs de référence (HYPOTHÈSES) à vérifier avec symbol_info de votre broker.
# En live, le bot lit tick_size, tick_value, contract_size, volume_* directement depuis MT5.
#
# Ce qui influence les résultats :
#  - % de risque et R : quasi indépendants de tick_value (le sizing s'ajuste) ;
#  - taille minimale 0,01 lot et plafond de levier : dépendent de tick_value ;
#  - coûts : spread (typical_spread_pips x pip_size) et commission (par lot, FX seulement).
# tick_value = valeur monétaire d'un tick pour 1 lot, en devise du compte (USD).
# session_* = heures UTC incluses pendant lesquelles le symbole peut être tradé.

EURUSD:
  digits: 5
  pip_size: 0.0001
  tick_size: 0.00001
  tick_value: 1.0            # 100 000 x 0,00001
  contract_size: 100000
  volume_min: 0.01
  volume_step: 0.01
  volume_max: 100.0
  typical_spread_pips: 0.8
  quote_is_usd: true
  session_start: 7
  session_end: 20
  commission_per_lot: 3.0    # FX : commission aller-retour par lot (à vérifier)

